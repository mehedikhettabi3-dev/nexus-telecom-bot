services:
  - type: worker
    name: nexus-telecom-bot
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node real_production_bot.js
    disk:
      name: baileys-session-disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: ADMIN_PHONE
        value: 212625489153
      - key: WASIT_PHONE
        value: 212699469649
      - key: BOT_PHONE
        value: 212699469649
