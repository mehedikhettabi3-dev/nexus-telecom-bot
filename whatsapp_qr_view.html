<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ربط واتساب البوت - NEXUS TELECOM</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
      color: #38bdf8;
    }
    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 20px 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .qr-container img {
      display: block;
      width: 320px;
      height: 320px;
      border-radius: 4px;
    }
    .steps {
      text-align: right;
      font-size: 15px;
      line-height: 1.8;
      background: #0f172a;
      padding: 15px 20px;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">NEXUS-TELECOM BOT</div>
    <h1>📲 امسح كود الواتساب (QR Code)</h1>
    <div class="qr-container">
      <img src="C:/Users/Dell/Desktop/SCAN_ME.png" alt="WhatsApp QR Code">
    </div>
    <div class="steps">
      <b>طريقة الربط بالهاتف (0699469649):</b><br>
      1. افتح تطبيق <b>واتساب</b> في هاتفك.<br>
      2. اضغط على <b>الأجهزة المرتبطة (Linked Devices)</b>.<br>
      3. اضغط على <b>ربط جهاز (Link a Device)</b>.<br>
      4. وجّه كاميرا الهاتف نحو الكود أعلاه مباشرة.
    </div>
  </div>
</body>
</html>
